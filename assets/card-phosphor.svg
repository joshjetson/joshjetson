      <stop offset="50%" stop-color="#3dfb9a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3dfb9a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cc1"><rect width="410" height="176" rx="8"/></clipPath>
  </defs>

  <rect width="410" height="176" rx="8" fill="#060c0a"/>
