    <line x1="0" y1="36" x2="410" y2="36" stroke="#3dfb9a" stroke-width="1" opacity="0.28"/>

    <text x="18" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#ffb454" opacity="0.9">[01]</text>
    <rect x="263" y="10" width="129" height="17" rx="8.5" fill="#ffb454" opacity="0.14"/><rect x="263" y="10" width="129" height="17" rx="8.5" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.6"/><text x="327.5" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.6" fill="#ffb454">CRATES.IO · 162 DL</text>

    <g filter="url(#b1)">
      <text x="18" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700"
