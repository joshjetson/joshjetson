    </g>
    <text x="18" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#2bc077">A full DAW that lives in your terminal.</text>
    <text x="18" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">6 synths · 10 drum kits · 300+ patches</text><text x="18" y="115" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">Lock-free realtime audio thread. No mutex.</text><text x="18" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">MIDI auto-detected. Runs fine over SSH.</text>
    <rect x="18" y="144" width="41" height="17" rx="8.5" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.5"/><text x="38.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#3dfb9a" opacity="0.9">RUST</text><rect x="65" y="144" width="34" height="17" rx="8.5" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.5"/><text x="82.0" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#3dfb9a" opacity="0.9">TUI</text><rect x="105" y="144" width="34" height="17" rx="8.5" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.5"/><text x="122.0" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#3dfb9a" opacity="0.9">DSP</text><rect x="145" y="144" width="67" height="17" rx="8.5" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.5"/><text x="178.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#3dfb9a" opacity="0.9">REALTIME</text>

    <g transform="translate(306,44)" opacity="0.95">
