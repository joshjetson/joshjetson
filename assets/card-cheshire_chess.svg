<svg xmlns="http://www.w3.org/2000/svg" width="410" height="176" viewBox="0 0 410 176" role="img" aria-label="cheshire_chess — A whole chess club in a terminal.">
  <defs>
    <filter id="b4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sc4" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.20"/>
    </pattern>
    <linearGradient id="sw4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffb454" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cc4"><rect width="410" height="176" rx="8"/></clipPath>
  </defs>

  <rect width="410" height="176" rx="8" fill="#060c0a"/>
  <g clip-path="url(#cc4)">
    <rect x="0" y="0" width="410" height="36" fill="#ffb454" opacity="0.05"/>
    <line x1="0" y1="36" x2="410" y2="36" stroke="#ffb454" stroke-width="1" opacity="0.28"/>

    <text x="18" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#ffb454" opacity="0.9">[04]</text>
    <rect x="263" y="10" width="129" height="17" rx="8.5" fill="#ffb454" opacity="0.14"/><rect x="263" y="10" width="129" height="17" rx="8.5" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.6"/><text x="327.5" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.6" fill="#ffb454">CRATES.IO · 280 DL</text>

    <g filter="url(#b4)">
      <text x="18" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700"
            letter-spacing="0.6" fill="#ffb454">cheshire_chess</text>
    </g>
    <text x="18" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#2bc077">A whole chess club in a terminal.</text>
    <text x="18" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">5.8M puzzles · 62 lessons · 10 opponents</text><text x="18" y="115" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">Online rooms, chat and training mini-games.</text><text x="18" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">No browser. No Electron. Works over SSH.</text>
    <rect x="18" y="144" width="41" height="17" rx="8.5" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.5"/><text x="38.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#ffb454" opacity="0.9">RUST</text><rect x="65" y="144" width="34" height="17" rx="8.5" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.5"/><text x="82.0" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#ffb454" opacity="0.9">TUI</text><rect x="105" y="144" width="87" height="17" rx="8.5" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.5"/><text x="148.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#ffb454" opacity="0.9">MULTIPLAYER</text>

    <g transform="translate(306,44)" opacity="0.95">
    <g><rect x="0" y="0" width="17" height="17" fill="#ffb454" opacity="0.16"/><rect x="34" y="0" width="17" height="17" fill="#ffb454" opacity="0.16"/><rect x="17" y="17" width="17" height="17" fill="#ffb454" opacity="0.16"/><rect x="51" y="17" width="17" height="17" fill="#ffb454" opacity="0.16"/><rect x="0" y="34" width="17" height="17" fill="#ffb454" opacity="0.16"/><rect x="34" y="34" width="17" height="17" fill="#ffb454" opacity="0.16"/><rect x="17" y="51" width="17" height="17" fill="#ffb454" opacity="0.16"/><rect x="51" y="51" width="17" height="17" fill="#ffb454" opacity="0.16"/></g>
    <rect x="0" y="0" width="68" height="68" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.5"/>
    <circle r="4.5" fill="#ffb454">
      <animateMotion dur="4.4s" repeatCount="indefinite"
        path="M8.5 59.5 L42.5 42.5 L8.5 25.5 L42.5 8.5 L59.5 42.5 L25.5 59.5 L8.5 59.5"/>
      <animate attributeName="opacity" values="1;0.45;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
</g>

    <rect x="0" y="-42" width="410" height="42" fill="url(#sw4)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 226"
        dur="7.5s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect width="410" height="176" fill="url(#sc4)"/>
  </g>
  <rect x="0.5" y="0.5" width="409" height="175" rx="8" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.45"/>
  <path d="M1 14 L1 1 L14 1" fill="none" stroke="#ffb454" stroke-width="2" opacity="0.85"/>
  <path d="M396 175 L409 175 L409 162" fill="none" stroke="#ffb454" stroke-width="2" opacity="0.85"/>
</svg>
