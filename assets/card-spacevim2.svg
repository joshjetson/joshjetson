<svg xmlns="http://www.w3.org/2000/svg" width="410" height="176" viewBox="0 0 410 176" role="img" aria-label="spacevim2 — SpaceVim, picked back up and kept alive.">
  <defs>
    <filter id="b6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sc6" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.20"/>
    </pattern>
    <linearGradient id="sw6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dfb9a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3dfb9a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3dfb9a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cc6"><rect width="410" height="176" rx="8"/></clipPath>
  </defs>

  <rect width="410" height="176" rx="8" fill="#060c0a"/>
  <g clip-path="url(#cc6)">
    <rect x="0" y="0" width="410" height="36" fill="#3dfb9a" opacity="0.05"/>
    <line x1="0" y1="36" x2="410" y2="36" stroke="#3dfb9a" stroke-width="1" opacity="0.28"/>

    <text x="18" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#ffb454" opacity="0.9">[06]</text>
    <rect x="282" y="10" width="110" height="17" rx="8.5" fill="#ffb454" opacity="0.14"/><rect x="282" y="10" width="110" height="17" rx="8.5" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.6"/><text x="337.0" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.6" fill="#ffb454">MAINTAINED FORK</text>

    <g filter="url(#b6)">
      <text x="18" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700"
            letter-spacing="0.6" fill="#3dfb9a">spacevim2</text>
    </g>
    <text x="18" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#2bc077">SpaceVim, picked back up and kept alive.</text>
    <text x="18" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">Layer-based Vim/Neovim distro, revived.</text><text x="18" y="115" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">~630k lines of dead weight removed.</text><text x="18" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">81 checks on both editors, every change.</text>
    <rect x="18" y="144" width="41" height="17" rx="8.5" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.5"/><text x="38.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#3dfb9a" opacity="0.9">VIML</text><rect x="65" y="144" width="34" height="17" rx="8.5" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.5"/><text x="82.0" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#3dfb9a" opacity="0.9">LUA</text><rect x="105" y="144" width="60" height="17" rx="8.5" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.5"/><text x="135.0" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#3dfb9a" opacity="0.9">TOOLING</text>

    <g transform="translate(306,44)" opacity="0.95"><rect x="0" y="4" width="92" height="11" rx="2" fill="#3dfb9a" opacity="0.18"/><rect x="0" y="4" width="92" height="11" rx="2" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.55"/><rect x="4" y="7" width="5" height="5" fill="#3dfb9a" opacity="0.9"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="0" y="20" width="86" height="11" rx="2" fill="#3dfb9a" opacity="0.18"/><rect x="0" y="20" width="86" height="11" rx="2" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.55"/><rect x="4" y="23" width="5" height="5" fill="#3dfb9a" opacity="0.9"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></rect><rect x="0" y="36" width="80" height="11" rx="2" fill="#3dfb9a" opacity="0.18"/><rect x="0" y="36" width="80" height="11" rx="2" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.55"/><rect x="4" y="39" width="5" height="5" fill="#3dfb9a" opacity="0.9"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></rect><rect x="0" y="52" width="74" height="11" rx="2" fill="#3dfb9a" opacity="0.18"/><rect x="0" y="52" width="74" height="11" rx="2" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.55"/><rect x="4" y="55" width="5" height="5" fill="#3dfb9a" opacity="0.9"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" begin="1.2000000000000002s" repeatCount="indefinite"/></rect>
    <rect x="0" y="76" width="7" height="11" fill="#ffb454">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
    </rect></g>

    <rect x="0" y="-42" width="410" height="42" fill="url(#sw6)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 226"
        dur="7.5s" begin="5.4s" repeatCount="indefinite"/>
    </rect>
    <rect width="410" height="176" fill="url(#sc6)"/>
  </g>
  <rect x="0.5" y="0.5" width="409" height="175" rx="8" fill="none" stroke="#3dfb9a" stroke-width="1" opacity="0.45"/>
  <path d="M1 14 L1 1 L14 1" fill="none" stroke="#3dfb9a" stroke-width="2" opacity="0.85"/>
  <path d="M396 175 L409 175 L409 162" fill="none" stroke="#3dfb9a" stroke-width="2" opacity="0.85"/>
</svg>
