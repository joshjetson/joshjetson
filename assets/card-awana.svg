<svg xmlns="http://www.w3.org/2000/svg" width="410" height="176" viewBox="0 0 410 176" role="img" aria-label="awana — Club management for Awana, worldwide.">
  <defs>
    <filter id="b7" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sc7" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.20"/>
    </pattern>
    <linearGradient id="sw7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57e2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#57e2ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#57e2ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cc7"><rect width="410" height="176" rx="8"/></clipPath>
  </defs>

  <rect width="410" height="176" rx="8" fill="#060c0a"/>
  <g clip-path="url(#cc7)">
    <rect x="0" y="0" width="410" height="36" fill="#57e2ff" opacity="0.05"/>
    <line x1="0" y1="36" x2="410" y2="36" stroke="#57e2ff" stroke-width="1" opacity="0.28"/>

    <text x="18" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#ffb454" opacity="0.9">[07]</text>
    <rect x="295" y="10" width="97" height="17" rx="8.5" fill="#ffb454" opacity="0.14"/><rect x="295" y="10" width="97" height="17" rx="8.5" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.6"/><text x="343.5" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.6" fill="#ffb454">IN PRODUCTION</text>

    <g filter="url(#b7)">
      <text x="18" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700"
            letter-spacing="0.6" fill="#57e2ff">awana</text>
    </g>
    <text x="18" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#2bc077">Club management for Awana, worldwide.</text>
    <text x="18" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">Students, attendance, check-in/out, bucks.</text><text x="18" y="115" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">One-controller declarative architecture.</text><text x="18" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">Grails 6 + HTMX + Tailwind + Postgres.</text>
    <rect x="18" y="144" width="54" height="17" rx="8.5" fill="none" stroke="#57e2ff" stroke-width="1" opacity="0.5"/><text x="45.0" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#57e2ff" opacity="0.9">GRAILS</text><rect x="78" y="144" width="41" height="17" rx="8.5" fill="none" stroke="#57e2ff" stroke-width="1" opacity="0.5"/><text x="98.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#57e2ff" opacity="0.9">HTMX</text><rect x="125" y="144" width="67" height="17" rx="8.5" fill="none" stroke="#57e2ff" stroke-width="1" opacity="0.5"/><text x="158.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#57e2ff" opacity="0.9">POSTGRES</text>

    <g transform="translate(306,44)" opacity="0.95">
    <g fill="none" stroke="#57e2ff">
      <circle cx="46" cy="30" r="27" stroke-width="1.4" opacity="0.75"/>
      <circle cx="46" cy="30" r="19" stroke-width="1.2" opacity="0.5"/>
      <circle cx="46" cy="30" r="11" stroke-width="1" opacity="0.32"/>
    </g>
    <circle cx="46" cy="30" r="4.5" fill="#ffb454">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="30" r="27" fill="none" stroke="#57e2ff" stroke-width="1.6"
            stroke-dasharray="24 146" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 46 30" to="360 46 30"
        dur="7s" repeatCount="indefinite"/>
    </circle>
    <rect x="0" y="80" width="9" height="12" rx="1.5" fill="#57e2ff" opacity="0.45"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.4s" repeatCount="indefinite"/></rect><rect x="13" y="72" width="9" height="20" rx="1.5" fill="#57e2ff" opacity="0.45"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.65s" repeatCount="indefinite"/></rect><rect x="26" y="77" width="9" height="15" rx="1.5" fill="#57e2ff" opacity="0.45"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.9s" repeatCount="indefinite"/></rect><rect x="39" y="66" width="9" height="26" rx="1.5" fill="#57e2ff" opacity="0.45"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="3.15s" repeatCount="indefinite"/></rect><rect x="52" y="70" width="9" height="22" rx="1.5" fill="#57e2ff" opacity="0.45"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="3.4s" repeatCount="indefinite"/></rect><rect x="65" y="62" width="9" height="30" rx="1.5" fill="#57e2ff" opacity="0.45"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="3.65s" repeatCount="indefinite"/></rect><rect x="78" y="67" width="9" height="25" rx="1.5" fill="#57e2ff" opacity="0.45"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="3.9s" repeatCount="indefinite"/></rect></g>

    <rect x="0" y="-42" width="410" height="42" fill="url(#sw7)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 226"
        dur="7.5s" begin="6.3s" repeatCount="indefinite"/>
    </rect>
    <rect width="410" height="176" fill="url(#sc7)"/>
  </g>
  <rect x="0.5" y="0.5" width="409" height="175" rx="8" fill="none" stroke="#57e2ff" stroke-width="1" opacity="0.45"/>
  <path d="M1 14 L1 1 L14 1" fill="none" stroke="#57e2ff" stroke-width="2" opacity="0.85"/>
  <path d="M396 175 L409 175 L409 162" fill="none" stroke="#57e2ff" stroke-width="2" opacity="0.85"/>
</svg>
