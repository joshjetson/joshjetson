  <!-- Every element's BASE state is the finished screen; the animations only
       play it in. If SMIL never runs, the banner still reads correctly. -->

  <!-- one-shot flood as the tube is primed -->
  <rect width="840" height="232" fill="#3dfb9a" opacity="0">
    <animate attributeName="opacity" values="0.30;0.05;0" keyTimes="0;0.35;1" dur="1.1s" fill="freeze"/>
  </rect>

  <!-- the beam writes the name, then the phosphor blooms in and holds -->
  <g filter="url(#bloom)">
    <text x="420" y="112" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="68"
          font-weight="700" letter-spacing="8" fill="none" stroke="#3dfb9a" stroke-width="1.1"
          stroke-dasharray="2600" stroke-dashoffset="0" opacity="0">JOSHJETSON
      <animate attributeName="stroke-dashoffset" from="2600" to="0" begin="0.35s" dur="2.1s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.09;0.72;1" dur="3.2s" fill="freeze"/>
    </text>
    <text x="420" y="112" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="68"
          font-weight="700" letter-spacing="8" fill="#3dfb9a" opacity="1">JOSHJETSON
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.607;1" dur="2.8s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.88;1;0.94;1" dur="5.2s" begin="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <g opacity="1">
