<svg xmlns="http://www.w3.org/2000/svg" width="410" height="176" viewBox="0 0 410 176" role="img" aria-label="lambda — A digital entities game.">
  <defs>
    <filter id="b5" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sc5" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.20"/>
    </pattern>
    <linearGradient id="sw5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5c8a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff5c8a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff5c8a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cc5"><rect width="410" height="176" rx="8"/></clipPath>
  </defs>

  <rect width="410" height="176" rx="8" fill="#060c0a"/>
  <g clip-path="url(#cc5)">
    <rect x="0" y="0" width="410" height="36" fill="#ff5c8a" opacity="0.05"/>
    <line x1="0" y1="36" x2="410" y2="36" stroke="#ff5c8a" stroke-width="1" opacity="0.28"/>

    <text x="18" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#ffb454" opacity="0.9">[05]</text>
    <rect x="301" y="10" width="91" height="17" rx="8.5" fill="#ffb454" opacity="0.14"/><rect x="301" y="10" width="91" height="17" rx="8.5" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.6"/><text x="346.5" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.6" fill="#ffb454">LED HARDWARE</text>

    <g filter="url(#b5)">
      <text x="18" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700"
            letter-spacing="0.6" fill="#ff5c8a">lambda</text>
    </g>
    <text x="18" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#2bc077">A digital entities game.</text>
    <text x="18" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">Hybrid board + telnet multiplayer game.</text><text x="18" y="115" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">Real chmod, real permissions, real combat.</text><text x="18" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f8a58">Trade solutions. First solver wins.</text>
    <rect x="18" y="144" width="54" height="17" rx="8.5" fill="none" stroke="#ff5c8a" stroke-width="1" opacity="0.5"/><text x="45.0" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#ff5c8a" opacity="0.9">GROOVY</text><rect x="78" y="144" width="54" height="17" rx="8.5" fill="none" stroke="#ff5c8a" stroke-width="1" opacity="0.5"/><text x="105.0" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#ff5c8a" opacity="0.9">TELNET</text><rect x="138" y="144" width="67" height="17" rx="8.5" fill="none" stroke="#ff5c8a" stroke-width="1" opacity="0.5"/><text x="171.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#ff5c8a" opacity="0.9">HARDWARE</text>

    <g transform="translate(306,44)" opacity="0.95">
    <g><circle cx="4" cy="4" r="1.1" fill="#0e2b1f"/><circle cx="4" cy="20" r="1.1" fill="#0e2b1f"/><circle cx="4" cy="36" r="1.1" fill="#0e2b1f"/><circle cx="4" cy="52" r="1.1" fill="#0e2b1f"/><circle cx="4" cy="68" r="1.1" fill="#0e2b1f"/><circle cx="20" cy="4" r="1.1" fill="#0e2b1f"/><circle cx="20" cy="20" r="1.1" fill="#0e2b1f"/><circle cx="20" cy="36" r="1.1" fill="#0e2b1f"/><circle cx="20" cy="52" r="1.1" fill="#0e2b1f"/><circle cx="20" cy="68" r="1.1" fill="#0e2b1f"/><circle cx="36" cy="4" r="1.1" fill="#0e2b1f"/><circle cx="36" cy="20" r="1.1" fill="#0e2b1f"/><circle cx="36" cy="36" r="1.1" fill="#0e2b1f"/><circle cx="36" cy="52" r="1.1" fill="#0e2b1f"/><circle cx="36" cy="68" r="1.1" fill="#0e2b1f"/><circle cx="52" cy="4" r="1.1" fill="#0e2b1f"/><circle cx="52" cy="20" r="1.1" fill="#0e2b1f"/><circle cx="52" cy="36" r="1.1" fill="#0e2b1f"/><circle cx="52" cy="52" r="1.1" fill="#0e2b1f"/><circle cx="52" cy="68" r="1.1" fill="#0e2b1f"/><circle cx="68" cy="4" r="1.1" fill="#0e2b1f"/><circle cx="68" cy="20" r="1.1" fill="#0e2b1f"/><circle cx="68" cy="36" r="1.1" fill="#0e2b1f"/><circle cx="68" cy="52" r="1.1" fill="#0e2b1f"/><circle cx="68" cy="68" r="1.1" fill="#0e2b1f"/><circle cx="84" cy="4" r="1.1" fill="#0e2b1f"/><circle cx="84" cy="20" r="1.1" fill="#0e2b1f"/><circle cx="84" cy="36" r="1.1" fill="#0e2b1f"/><circle cx="84" cy="52" r="1.1" fill="#0e2b1f"/><circle cx="84" cy="68" r="1.1" fill="#0e2b1f"/></g>
    <text x="46" y="58" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="58" font-weight="700"
          fill="#ff5c8a" opacity="0.9">&#955;</text>
    <circle cx="20" cy="20" r="3" fill="#ff5c8a">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="52" r="3" fill="#57e2ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
</g>

    <rect x="0" y="-42" width="410" height="42" fill="url(#sw5)">
